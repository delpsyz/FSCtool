<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSC 产品分类代码查询工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#f5f7fa;color:#2d3748;min-height:100vh;line-height:1.6}
.header{background:linear-gradient(135deg,#1e3a5f 0%,#2c5282 100%);color:#fff;padding:32px 24px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.header h1{font-size:28px;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
.header p{font-size:15px;opacity:.9}
.container{max-width:900px;margin:0 auto;padding:28px 20px}

/* Query Builder Section */
.builder-card{background:#fff;border-radius:16px;padding:28px;margin-bottom:20px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.builder-title{font-size:18px;font-weight:700;color:#1e3a5f;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.builder-title .icon{font-size:22px}
.builder-desc{font-size:14px;color:#5a6c7d;margin-bottom:20px;background:#f8fafc;padding:12px 16px;border-radius:10px;border-left:4px solid #2c5282}
.prod-card{border:1px solid #e8ecf0;border-radius:12px;padding:18px;margin-bottom:12px;background:#fff;transition:all .2s}
.prod-card:hover{border-color:#c3d4e8;box-shadow:0 2px 12px rgba(44,82,130,.06)}
.prod-card-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.prod-num{width:30px;height:30px;background:#2c5282;color:#fff;font-weight:800;font-size:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prod-name-input{flex:1;padding:10px 14px;font-size:15px;font-weight:500;border:1px solid #dce3ea;border-radius:10px;outline:none;transition:all .2s}
.prod-name-input:focus{border-color:#2c5282;box-shadow:0 0 0 3px rgba(44,82,130,.1)}
.prod-name-input::placeholder{color:#a0aec0;font-weight:400}
.btn-del-prod{width:34px;height:34px;border:none;background:#fef2f2;color:#ef4444;border-radius:10px;cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.btn-del-prod:hover{background:#ef4444;color:#fff}
.mat-row{display:flex;flex-wrap:wrap;gap:8px;padding-left:42px}
.mat-tag{display:inline-flex;align-items:center;gap:6px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:6px 12px;font-size:13px;color:#166534;font-weight:500}
.mat-tag input{background:none;border:none;outline:none;font-size:13px;color:#166534;font-weight:500;width:90px}
.mat-tag input::placeholder{color:#86efac}
.mat-tag .del{color:#86efac;cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.mat-tag .del:hover{color:#ef4444}
.btn-add-mat2{font-size:13px;color:#5a6c7d;background:#f8fafc;border:1px dashed #c3d4e8;border-radius:10px;padding:8px 16px;cursor:pointer;font-weight:500;transition:all .2s;margin-left:42px}
.btn-add-mat2:hover{border-color:#2c5282;color:#2c5282;background:#f0f4f8}
.builder-actions{display:flex;gap:12px;margin-top:20px}
.btn-query{background:linear-gradient(135deg,#2c5282,#1e3a5f);color:#fff;border:none;border-radius:12px;padding:14px 32px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 4px 12px rgba(44,82,130,.25)}
.btn-query:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(44,82,130,.35)}
.btn-query:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-clear{background:#fff;color:#5a6c7d;border:1px solid #dce3ea;border-radius:12px;padding:14px 24px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-clear:hover{background:#f8fafc;border-color:#c3d4e8}

/* Results Section */
.results-card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.results-header h3{font-size:18px;font-weight:700;color:#1e3a5f;display:flex;align-items:center;gap:10px}
.results-actions{display:flex;gap:10px}
.btn-copy,.btn-export{font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;cursor:pointer;transition:all .2s}
.btn-copy{background:#f0f4f8;color:#2c5282;border:1px solid #c3d4e8}
.btn-copy:hover{background:#2c5282;color:#fff;border-color:#2c5282}
.btn-export{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.btn-export:hover{background:#166534;color:#fff;border-color:#166534}
.btn-copy.copied{background:#166534;color:#fff;border-color:#166534}
.summary-bar{background:#f0f4f8;border-radius:12px;padding:14px 18px;margin-bottom:18px;display:flex;gap:24px;flex-wrap:wrap;font-size:14px;color:#2c5282;font-weight:600}
.summary-bar span{display:flex;align-items:center;gap:8px}
.empty-state{text-align:center;padding:48px 20px;color:#a0aec0}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state h3{font-size:18px;color:#718096;margin-bottom:8px}
.empty-state p{font-size:14px}
.result-list{display:flex;flex-direction:column;gap:12px}
.result-prod-group{border:1px solid #e8ecf0;border-radius:12px;overflow:hidden;animation:fadeIn .3s ease}
.result-prod-header{display:flex;align-items:center;padding:14px 18px;background:#f8fafc;border-bottom:1px solid #e8ecf0;gap:12px}
.result-prod-num{width:28px;height:28px;background:#2c5282;color:#fff;font-weight:800;font-size:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.result-prod-name{font-size:15px;font-weight:700;color:#2d3748;flex:1}
.result-mat-rows{padding:12px 18px}
.result-mat-row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed #e8ecf0}
.result-mat-row:last-child{border-bottom:none}
.result-mat-name{font-size:14px;font-weight:600;color:#4a5568;min-width:100px;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-arrow{color:#a0aec0;font-size:14px}
.result-match-tags{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.match-tag{display:inline-flex;align-items:center;gap:5px;background:#f0f4f8;border:1px solid #c3d4e8;border-radius:8px;padding:4px 10px;font-size:13px}
.match-code{font-weight:800;color:#2c5282;font-family:"SF Mono",Monaco,Consolas,monospace;font-size:14px}
.match-name{color:#4a5568}
.match-score{font-size:11px;color:#a0aec0;padding:2px 6px;border-radius:4px}
.match-score.exact{color:#166534;background:#f0fdf4}
.match-score.related{color:#b45309;background:#fffbeb}
.match-score.fuzzy{color:#6b7280;background:#f3f4f6}
.no-match-tag{font-size:13px;color:#a0aec0;font-style:italic}

/* Search Section */
.search-section{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.search-section h3{font-size:16px;font-weight:700;color:#4a5568;margin-bottom:14px}
.search-box{position:relative}
.search-box input{width:100%;padding:14px 18px 14px 48px;font-size:15px;border:1px solid #dce3ea;border-radius:12px;outline:none;transition:all .2s;background:#fff}
.search-box input:focus{border-color:#2c5282;box-shadow:0 0 0 3px rgba(44,82,130,.1)}
.search-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#a0aec0;font-size:18px}
.search-stats{font-size:13px;color:#718096;margin-top:10px}

/* Toast */
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(100px);background:#1e3a5f;color:#fff;padding:14px 28px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;transition:transform .3s ease;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.toast.show{transform:translateX(-50%) translateY(0)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){
  .header h1{font-size:22px}.container{padding:16px 12px}
  .mat-row{padding-left:0}
  .btn-add-mat2{margin-left:0}
  .result-mat-row{flex-wrap:wrap}
  .result-mat-name{max-width:100%}
  .builder-actions{flex-direction:column}
  .btn-query,.btn-clear{width:100%;justify-content:center}
}
</style>
</head>
<body>
<div class="header">
<h1>FSC 产品分类代码查询工具</h1>
<p>基于 FSC-STD-40-004a V2-1 EN 标准 · 支持批量产品与原材料分类代码匹配</p>
</div>
<div class="container">

<!-- Query Builder -->
<div class="builder-card">
<div class="builder-title">
<span class="icon">&#128203;</span>
批量查询构建器
</div>
<div class="builder-desc">
输入产品名称及对应原材料，系统将自动匹配 FSC 分类代码。支持批量添加多个产品，每个产品支持多种原材料。
</div>
<div id="productList"></div>
<button class="btn-add-mat2" id="btnAddProduct" onclick="addProduct()">+ 添加产品</button>
<div class="builder-actions">
<button class="btn-query" id="btnQuery" onclick="doQuery()">&#128269; 查询匹配</button>
<button class="btn-clear" onclick="clearAll()">清空全部</button>
</div>
</div>

<!-- Results -->
<div class="results-card" id="resultsCard" style="display:none">
<div class="results-header">
<h3>&#128203; 匹配结果</h3>
<div class="results-actions">
<button class="btn-copy" id="btnCopy" onclick="copyResults()">&#128203; 复制结果</button>
<button class="btn-export" onclick="exportResults()">&#128190; 导出 Excel</button>
</div>
</div>
<div class="summary-bar" id="summaryBar"></div>
<div class="result-list" id="resultList"></div>
</div>

<!-- Search Section -->
<div class="search-section">
<div class="builder-title" style="margin-bottom:12px">
<span class="icon">&#128269;</span> FSC 分类代码库检索
</div>
<div class="search-box">
<span class="search-icon">&#128269;</span>
<input type="text" id="searchInput" placeholder="输入产品名称或分类代码进行搜索..." oninput="doSearch()">
</div>
<div class="search-stats" id="searchStats"></div>
<div class="result-list" id="searchResults" style="margin-top:16px"></div>
</div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

// ==================== PINYIN INDEX ====================
const PY_DATA=DATA.map(d=>{
  let py="";
  try{py=pinyinPro.pinyin(d.name,{toneType:"none"}).replace(/\s+/g,"").toLowerCase()}catch(e){py=""}
  let pyFull="";
  try{pyFull=pinyinPro.pinyin(d.name,{pattern:"first",toneType:"none"}).replace(/\s+/g,"").toLowerCase()}catch(e){pyFull=""}
  return{...d,py,pyFull};
});

// ==================== MATCHING ENGINE ====================
function matchItem(name){
  const q=name.trim().toLowerCase();
  if(!q)return[];
  const results=[];
  // Detect if query is pinyin (all latin letters)
  const isPinyin=/^[a-zA-Z]+$/.test(q);
  PY_DATA.forEach(d=>{
    let score=0;
    const nl=d.name.toLowerCase();
    const pl=d.path.toLowerCase();
    const el=d.examples.toLowerCase();
    if(nl===q)score=100;
    else if(nl.includes(q))score=80;
    else if(pl.includes(q))score=60;
    else if(el.includes(q))score=50;
    else{
      let qi=0;for(let ti=0;ti<nl.length&&qi<q.length;ti++){if(nl[ti]===q[qi])qi++}
      if(qi===q.length)score=30;
    }
    // Pinyin matching (lower priority than Chinese exact/name match)
    if(score===0&&isPinyin){
      if(d.py===q)score=75;        // full pinyin exact match
      else if(d.py.includes(q))score=65; // full pinyin contains
      else if(d.pyFull===q)score=55;    // first letter exact match
      else if(d.pyFull.includes(q))score=45; // first letter contains
      else{
        // fuzzy pinyin: check if all chars of query appear in order in full pinyin
        let qi=0;for(let ti=0;ti<d.py.length&&qi<q.length;ti++){if(d.py[ti]===q[qi])qi++}
        if(qi===q.length)score=35;
      }
    }
    if(score>0)results.push({code:d.code,name:d.name,score});
  });
  results.sort((a,b)=>b.score-a.score);
  return results.slice(0,5);
}

function scoreLabel(s){
  if(s>=80)return{text:"精确",cls:"exact"};
  if(s>=50)return{text:"相关",cls:"related"};
  return{text:"模糊",cls:"fuzzy"};
}

// ==================== BATCH QUERY STATE ====================
let products=[]; // [{id, name, mats:[{id,name}]}]
let nextId=1;

function addProduct(name,mats){
  const id=nextId++;
  products.push({id,name:name||"",mats:mats||[]});
  renderProducts();
  return id;
}

function removeProduct(pid){
  products=products.filter(p=>p.id!==pid);
  renderProducts();
}

function addMatToProduct(pid,name){
  const p=products.find(p=>p.id===pid);
  if(p){
    p.mats.push({id:Date.now(),name:name||""});
    renderProducts();
  }
}

function removeMatFromProduct(pid,mid){
  const p=products.find(p=>p.id===pid);
  if(p){p.mats=p.mats.filter(m=>m.id!==mid);renderProducts()}
}

function updateProdName(pid,name){
  const p=products.find(p=>p.id===pid);
  if(p)p.name=name;
}

function updateMatName(pid,mid,name){
  const p=products.find(p=>p.id===pid);
  if(p){
    const m=p.mats.find(m=>m.id===mid);
    if(m)m.name=name;
  }
}

function renderProducts(){
  const container=document.getElementById("productList");
  let html="";
  products.forEach((p,i)=>{
    html+=`<div class="prod-card" id="prod_${p.id}">
      <div class="prod-card-top">
        <span class="prod-num">${i+1}</span>
        <input type="text" class="prod-name-input" placeholder="输入产品名称，如：床、桌子、刨花板..." value="${escHtml(p.name)}" oninput="updateProdName(${p.id},this.value)">
        <button class="btn-del-prod" onclick="removeProduct(${p.id})" title="删除此产品">&times;</button>
      </div>
      <div class="mat-row" id="matRow_${p.id}">`;
    p.mats.forEach(m=>{
      html+=`<span class="mat-tag" id="matTag_${m.id}">
        <input type="text" value="${escHtml(m.name)}" placeholder="原材料" oninput="updateMatName(${p.id},${m.id},this.value)">
        <span class="del" onclick="removeMatFromProduct(${p.id},${m.id})">&times;</span>
      </span>`;
    });
    html+=`</div>
      <button class="btn-add-mat2" onclick="addMatToProduct(${p.id},'')">+ 添加原材料</button>
    </div>`;
  });
  container.innerHTML=html;
  // Focus first empty product name if exists
  const firstEmpty=container.querySelector('.prod-name-input:not([value])');
  if(firstEmpty)firstEmpty.focus();
}

function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

function clearAll(){
  products=[];
  nextId=1;
  renderProducts();
  document.getElementById("resultsCard").style.display="none";
}

// ==================== QUERY LOGIC ====================
function doQuery(){
  const validProds=products.filter(p=>p.name.trim()||p.mats.some(m=>m.name.trim()));
  if(validProds.length===0){showToast("请至少添加一个产品名称");return;}
  const results=[];
  let totalMats=0,matched=0;
  validProds.forEach(p=>{
    const itemResults={prod:p.name.trim()||"(未命名)",mats:[]};
    const validMats=p.mats.filter(m=>m.name.trim());
    totalMats+=validMats.length;
    if(validMats.length===0){
      itemResults.mats.push({name:"—",matches:[]});
    }else{
      validMats.forEach(m=>{
        const matches=matchItem(m.name.trim());
        if(matches.length>0)matched++;
        itemResults.mats.push({name:m.name.trim(),matches});
      });
    }
    results.push(itemResults);
  });

  // Render
  const resultsCard=document.getElementById("resultsCard");
  resultsCard.style.display="block";
  resultsCard.scrollIntoView({behavior:"smooth",block:"start"});

  const summaryBar=document.getElementById("summaryBar");
  summaryBar.innerHTML=`
    <span>&#128203; 产品: ${validProds.length} 个</span>
    <span>&#128230; 原材料: ${totalMats} 个</span>
    <span>&#10004; 匹配成功: ${matched} 个</span>
  `;

  const resultList=document.getElementById("resultList");
  if(results.length===0){
    resultList.innerHTML=`<div class="empty-state"><div class="icon">&#128269;</div><h3>未找到匹配结果</h3><p>请尝试调整关键词</p></div>`;
    return;
  }
  let html="";
  results.forEach((rp,pi)=>{
    html+=`<div class="result-prod-group">
      <div class="result-prod-header">
        <span class="result-prod-num">${pi+1}</span>
        <span class="result-prod-name">${escHtml(rp.prod)}</span>
      </div>
      <div class="result-mat-rows">`;
    rp.mats.forEach(rm=>{
      html+=`<div class="result-mat-row">
        <span class="result-mat-name" title="${escHtml(rm.name)}">${escHtml(rm.name)}</span>
        <span class="result-arrow">&#10132;</span>
        <div class="result-match-tags">`;
      if(rm.matches.length>0){
        rm.matches.forEach(m=>{
          const lbl=scoreLabel(m.score);
          html+=`<span class="match-tag"><span class="match-code">${m.code}</span><span class="match-name">${escHtml(m.name)}</span><span class="match-score ${lbl.cls}">${lbl.text}</span></span>`;
        });
      }else{
        html+=`<span class="no-match-tag">未匹配到分类代码</span>`;
      }
      html+=`</div></div>`;
    });
    html+=`</div></div>`;
  });
  resultList.innerHTML=html;
}

// ==================== SEARCH SECTION ====================
function fuzzyMatch(text,query,pyText,pyFullText){
  if(!query)return true;
  const q=query.toLowerCase().trim();
  const t=text.toLowerCase();
  if(t.includes(q))return true;
  let qi=0;for(let ti=0;ti<t.length&&qi<q.length;ti++){if(t[ti]===q[qi])qi++}
  if(qi===q.length)return true;
  // Pinyin matching
  if(pyText&&pyText.includes(q))return true;
  if(pyFullText&&pyFullText.includes(q))return true;
  if(pyText){
    qi=0;for(let ti=0;ti<pyText.length&&qi<q.length;ti++){if(pyText[ti]===q[qi])qi++}
    if(qi===q.length)return true;
  }
  return false;
}
function doSearch(){
  const q=document.getElementById("searchInput").value.trim();
  const stats=document.getElementById("searchStats");
  const list=document.getElementById("searchResults");
  if(!q){stats.textContent="";list.innerHTML="";return;}
  const filtered=PY_DATA.filter(d=>fuzzyMatch(d.name,q,d.py,d.pyFull)||fuzzyMatch(d.code,q)||fuzzyMatch(d.path,q)||fuzzyMatch(d.examples,q));
  filtered.sort((a,b)=>{
    const ae=a.name.toLowerCase().includes(q.toLowerCase())?0:1;
    const be=b.name.toLowerCase().includes(q.toLowerCase())?0:1;
    if(ae!==be)return ae-be;
    const ac=a.code.toLowerCase().includes(q.toLowerCase())?0:1;
    const bc=b.code.toLowerCase().includes(q.toLowerCase())?0:1;
    if(ac!==bc)return ac-bc;
    return 0;
  });
  stats.textContent=`在 FSC 分类库中找到 ${filtered.length} 个匹配结果`;
  if(filtered.length===0){list.innerHTML="";return;}
  let html="";
  filtered.slice(0,30).forEach(d=>{
    const catColors={W:"#2f855a",P:"#2b6cb0",N:"#d69e2e"};
    const bgColors={W:"#f0fff4",P:"#ebf4ff",N:"#fffff0"};
    const color=catColors[d.cat]||"#4a5568";
    const bg=bgColors[d.cat]||"#f7fafc";
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin-bottom:4px;background:#fff;border:1px solid #e2e8f0;transition:all .2s" onmouseover="this.style.borderColor='${color}'" onmouseout="this.style.borderColor='#e2e8f0'">
      <span style="background:${bg};color:${color};font-weight:800;font-size:13px;padding:4px 10px;border-radius:6px;font-family:monospace;flex-shrink:0">${d.code}</span>
      <span style="font-size:13px;font-weight:600;color:#2d3748">${escHtml(d.name)}</span>
    </div>`;
  });
  if(filtered.length>30)html+=`<div style="text-align:center;color:#a0aec0;font-size:12px;padding:8px">还有 ${filtered.length-30} 个结果，请使用更精确的关键词</div>`;
  list.innerHTML=html;
}

// ==================== COPY & EXPORT ====================
let queryResultsData=[];
function copyResults(){
  const rp=document.getElementById("resultList");
  if(!rp.innerHTML){showToast("暂无结果可复制");return;}
  const lines=["FSC 产品分类代码匹配结果","=".repeat(40)];
  queryResultsData.forEach((r,i)=>{
    lines.push(`${i+1}. ${r.prod}`);
    r.mats.forEach(m=>{
      const codes=m.matches.map(x=>`${x.code} ${x.name}`).join(" | ");
      lines.push(`   ${m.name} => ${codes||"(未匹配)"}`);
    });
    lines.push("");
  });
  const text=lines.join("\n");
  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById("btnCopy");
    btn.textContent="已复制!";
    btn.classList.add("copied");
    setTimeout(()=>{btn.textContent="复制结果";btn.classList.remove("copied")},2000);
    showToast("结果已复制到剪贴板");
  }).catch(()=>showToast("复制失败，请手动选择"));
}

function exportResults(){
  if(queryResultsData.length===0){showToast("暂无结果可导出");return;}
  // Build CSV
  const rows=[["序号","产品名称","原材料","匹配代码","分类名称","匹配精度"]];
  queryResultsData.forEach((r,i)=>{
    if(r.mats.length===0||(r.mats.length===1&&r.mats[0].name==="—")){
      rows.push([i+1,r.prod,"—","—","—","—"]);
    }else{
      r.mats.forEach(m=>{
        if(m.matches.length===0){
          rows.push([i+1,r.prod,m.name,"—","—","未匹配"]);
        }else{
          m.matches.forEach(x=>{
            const lbl=scoreLabel(x.score);
            rows.push([i+1,r.prod,m.name,x.code,x.name,lbl.text]);
          });
        }
      });
    }
  });
  const csv="\uFEFF"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`FSC分类匹配结果_${new Date().toLocaleDateString("zh-CN").replace(/\//g,"-")}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("Excel 文件已下载");
}

// Hook doQuery to save data for export
const _doQuery=doQuery;
doQuery=function(){
  queryResultsData=[];
  _doQuery();
  // Collect data
  products.forEach(p=>{
    if(!p.name.trim()&&!p.mats.some(m=>m.name.trim()))return;
    const mats=[];
    p.mats.forEach(m=>{
      if(!m.name.trim())return;
      mats.push({name:m.name.trim(),matches:matchItem(m.name.trim())});
    });
    queryResultsData.push({prod:p.name.trim()||"(未命名)",mats});
  });
}

function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}
